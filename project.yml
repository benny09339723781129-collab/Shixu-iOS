# UI-test project only. Production IPA packaging remains scripts/build-ipa.sh.
# Spec checked against XcodeGen 2.46.0 ProjectSpec and Apple's XCUITest APIs.
name: ShixuJourney
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1"]
    Release:
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=0"]
targets:
  Shixu:
    type: application
    platform: iOS
    sources:
      - path: Shixu/main.m
      - path: Shixu/Native
        includes: ["*.m", "*.h"]
      - path: Shixu/Directory.json
        buildPhase: resources
      - path: Shixu/ShixuLogo.png
        buildPhase: resources
      - path: Shixu/LaunchScreen.storyboard
        buildPhase: resources
      # Dedicated public chart directory. test-ui.sh rejects files outside its
      # explicit index.html/chart.js/vendor/LICENSE/NOTICE allowlist before build.
      - path: Shixu/Resources/Chart
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Shixu
        PRODUCT_BUNDLE_IDENTIFIER: app.shixu.studio
        INFOPLIST_FILE: Shixu/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Shixu/Native"]
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: AuthenticationServices.framework
      - sdk: SafariServices.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
    postBuildScripts:
      - name: Copy only isolated Debug simulator fixtures
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -eu
          if [ "$CONFIGURATION" = Debug ] && [ "$PLATFORM_NAME" = iphonesimulator ]; then
            /bin/cp "$SRCROOT/Tests/FixtureProfile.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/FixtureProfile.plist"
            /bin/cp "$SRCROOT/Tests/FixtureAPI.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/FixtureAPI.plist"
            /usr/bin/plutil -replace CFBundleSupportedPlatforms -json '["iPhoneSimulator"]' "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
  ShixuJourneyTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/ShixuJourneyTests.swift
    dependencies:
      - target: Shixu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shixu.studio.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Shixu
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  ShixuJourney:
    build:
      targets:
        Shixu: all
        ShixuJourneyTests: [test]
    test:
      config: Debug
      targets:
        - name: ShixuJourneyTests
          parallelizable: false
          randomExecutionOrder: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      preferredScreenCaptureFormat: screenRecording
