name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    paths: ['Shixu/**', 'scripts/**', '.github/workflows/build-ipa.yml']
permissions:
  contents: read
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile the existing native shell without Apple signing credentials
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Shixu-iOS-unsigned
          path: |
            build/Shixu-unsigned.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
